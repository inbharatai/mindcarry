name: MindCarry CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout main source
        uses: actions/checkout@v4

      - name: Use Node.js 22.12
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high

      - name: Lint privileged and automation code
        run: npm run lint

      - name: Run dependency-free security smoke test
        run: npm run test:core

      - name: Run unit and integration tests
        run: npm test

      - name: Type-check and build renderer
        run: npm run build

      - name: Verify Windows Electron package layout
        if: runner.os == 'Windows'
        run: npx --no-install electron-builder --dir --win --x64