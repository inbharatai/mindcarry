name: MindCarry CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint secure main-process code
        run: npm run lint

      - name: Run dependency-free smoke test
        run: npm run test:core

      - name: Run unit and integration tests
        run: npm test

      - name: Type-check and build renderer
        run: npm run build

      - name: Verify Windows Electron package layout
        if: runner.os == 'Windows'
        run: npx electron-builder --dir --win --x64

      - name: Create source snapshot for repository audit
        if: runner.os == 'Linux'
        run: git archive --format=zip --output=mindcarry-source.zip HEAD

      - name: Upload source snapshot for repository audit
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mindcarry-source-audit
          path: mindcarry-source.zip
          if-no-files-found: error
          retention-days: 1