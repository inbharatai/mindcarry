name: MindCarry CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies and create deterministic lockfile
        run: npm install --no-audit --no-fund

      - name: Commit lockfile and remove merged feature branch
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git add package-lock.json
            git commit -m "chore: add deterministic npm lockfile"
            git push origin HEAD:main
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/feature/local-memory-graph" >/dev/null 2>&1 || true

      - name: Lint secure main-process code
        run: npm run lint

      - name: Run dependency-free smoke test
        run: npm run test:core

      - name: Run unit and integration tests
        run: npm test

      - name: Type-check and build renderer
        run: npm run build

      - name: Verify Windows Electron package layout
        if: runner.os == 'Windows'
        run: npx electron-builder --dir --win --x64